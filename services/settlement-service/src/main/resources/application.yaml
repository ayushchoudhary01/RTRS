springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: settlement-service

  datasource:
    url: jdbc:postgresql://localhost:5437/settlement_db
    username: rtrs_settlement
    password: rtrs_settlement_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

  kafka:
    bootstrap-servers: localhost:9092,localhost:9093,localhost:9094
    consumer:
      group-id: settlement-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8089

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

rtrs:
  security:
    jwt:
      secret-key: ${RTRS_JWT_SECRET}
      issuer: rtrs-auth-service
      audience: rtrs-services
      access-token-expiry-ms: 900000

  kafka:
    topics:
      trade-executed: trade.executed.v1
      settlement-settled: settlement.settled.v1
      settlement-failed: settlement.failed.v1
      settlement-escalated: settlement.escalated.v1

  settlement:
    settlement-cycle-days: 2
    max-retry-attempts: 3
    eod-cron: "0 0 18 * * *"

  ledger:
    base-url: http://localhost:8085

logging:
  level:
    com.rtrs: INFO
    org.springframework.kafka: WARN
    org.springframework.batch: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [traceId=%X{traceId}] %-5level %logger{36} - %msg%n"
