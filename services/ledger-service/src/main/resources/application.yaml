spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ledger-service

  datasource:
    url: jdbc:postgresql://localhost:5434/ledger_db
    username: rtrs_ledger
    password: rtrs_ledger_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:9092,localhost:9093,localhost:9094
    properties:
      schema.registry.url: http://localhost:8081
    consumer:
      group-id: ledger-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

rtrs:
  security:
    jwt:
      secret-key: ${RTRS_JWT_SECRET}
      issuer: rtrs-auth-service
      audience: rtrs-services
      access-token-expiry-ms: 900000

  kafka:
    topics:
      trade-executed: trade.executed.v1
      ledger-entry-created: ledger.entry.created.v1

logging:
  level:
    com.rtrs: INFO
    org.springframework.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [traceId=%X{traceId}] %-5level %logger{36} - %msg%n"