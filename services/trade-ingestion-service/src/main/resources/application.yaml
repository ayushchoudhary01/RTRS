spring:
  application:
    name: trade-ingestion-service

  datasource:
    url: jdbc:postgresql://localhost:5432/trade_db
    username: rtrs_trade
    password: rtrs_trade_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:9092,localhost:9093,localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      retries: 2147483647
      compression-type: lz4
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
        delivery.timeout.ms: 120000
    properties:
      schema.registry.url: http://localhost:8081

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 1000ms
      lettuce:
        pool:
          max-active: 8
          min-idle: 2

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

rtrs:
  security:
    jwt:
      secret-key: ${RTRS_JWT_SECRET}
      issuer: rtrs-auth-service
      audience: rtrs-services
      access-token-expiry-ms: 900000

  idempotency:
    ttl-hours: 24

  outbox:
    poll-interval-ms: 100
    batch-size: 50

  kafka:
    topics:
      trade-submitted: trade.submitted.v1
      trade-rejected: trade.rejected.v1

logging:
  level:
    com.rtrs: INFO
    org.springframework.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [traceId=%X{traceId}] %-5level %logger{36} - %msg%n"