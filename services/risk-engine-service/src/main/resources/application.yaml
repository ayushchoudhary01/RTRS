spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: risk-engine-service

  datasource:
    url: jdbc:postgresql://localhost:5435/risk_db
    username: rtrs_risk
    password: rtrs_risk_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:9092,localhost:9093,localhost:9094
    consumer:
      group-id: risk-engine-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    properties:
      schema.registry.url: http://localhost:8081

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

rtrs:
  security:
    jwt:
      secret-key: ${RTRS_JWT_SECRET}
      issuer: rtrs-auth-service
      audience: rtrs-services
      access-token-expiry-ms: 900000

  kafka:
    topics:
      trade-submitted: trade.submitted.v1
      risk-approved: risk.approved.v1
      risk-breached: risk.breached.v1

  risk:
    # Per-trade hard cap on notional
    position-limit-usd: 1000000
    # Fraction of notional treated as at-risk, standing in for real volatility
    var-threshold-percent: 2.0
    # Absolute VaR tolerance per trade — at 2% of notional this binds above
    # $750,000 of notional — deliberately tighter than the position limit, so
    # the rule is actually reachable rather than shadowed by PositionLimitRule
    var-limit-usd: 15000
    # Max accumulated exposure to a single instrument, as a % of the baseline below
    concentration-limit-percent: 20.0
    portfolio-baseline-usd: 10000000

logging:
  level:
    com.rtrs: INFO
    org.springframework.kafka: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [traceId=%X{traceId}] %-5level %logger{36} - %msg%n"